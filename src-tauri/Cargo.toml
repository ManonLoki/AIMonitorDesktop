[package]
name = "aimonitor-desktop"
version = "2.0.5"
description = "AI监控平台桌面版"
authors = ["ManonLoki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aimonitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_with = "=3.21.0"
tempfile = "=3.27.0"
uuid = { version = "=1.24.0", features = ["v4"] }
mdns-sd = "=0.20.2"
# 局域网 HTTP API 的网络层：纯异步实现，取代此前手写的 TcpListener + 线程池。
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.53.1", features = ["net", "fs", "rt", "time", "macros"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
hostname = "=0.4.2"
infer = "=0.19.0"
parking_lot = "=0.12.5"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "=2.5.1"
# 单实例限制（仅桌面平台）：第二次启动时把已运行实例的窗口显示并置前，而不是打开新进程。
tauri-plugin-single-instance = "=2.4.3"
